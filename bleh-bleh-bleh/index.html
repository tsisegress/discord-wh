<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discord Help</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Syne', sans-serif;
    }

    body {
      margin: 0;
      background: #0E0204;
      color: #DFBBCA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 420px;
      border: 1px solid #A30E2B;
      padding: 30px;
      border-radius: 14px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-top: 16px;
    }

    input, textarea, select {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      background: transparent;
      border: 1px solid #DFBBCA;
      border-radius: 8px;
      color: #DFBBCA;
    }

    input::placeholder,
    textarea::placeholder {
      color: #DFBBCA99;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #A30E2B;
    }

    #fileBox {
      display: none;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      background: #A30E2B;
      color: #DFBBCA;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .popup {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #A30E2B;
      color: #DFBBCA;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Webhook babu shyt</h1>

    <form id="webhookForm" enctype="multipart/form-data">

      <label>Webhook ka url dal chup chap:</label>
      <input type="text" name="webhook_url"
             placeholder="Webhook ka url dal chup chap:" required>

      <label>Kya bataun server ke logon ko:</label>
      <textarea name="message" rows="4"
                placeholder="Kya bataun server ke logon ko:" required></textarea>

      <label>
        Koi attachment? File attachment btw, vo nahi jo tujhe usse hui thi...
      </label>

      <select name="attach_choice" id="attachChoice">
        <option value="n">nah</option>
        <option value="y">yes</option>
      </select>

      <div id="fileBox">
        <label>Pura file path bta... :</label>
        <input type="file" name="file">
      </div>

      <button type="submit" id="sendBtn">SEND</button>
    </form>
  </div>

  <div id="popup" class="popup">hogya bhai!! 🚀</div>

  <script>
    const form = document.getElementById("webhookForm");
    const attachChoice = document.getElementById("attachChoice");
    const fileBox = document.getElementById("fileBox");
    const popup = document.getElementById("popup");
    const sendBtn = document.getElementById("sendBtn");

    attachChoice.addEventListener("change", () => {
      fileBox.style.display = attachChoice.value === "y" ? "block" : "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      sendBtn.disabled = true;

      const formData = new FormData(form);

      try {
        const res = await fetch("/send", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          popup.classList.add("show");
          setTimeout(() => popup.classList.remove("show"), 2000);
          form.reset();
          fileBox.style.display = "none";
        } else {
          alert("Kuch to gadbad hui hai bhai");
        }
      } catch {
        alert("Server down ya kuch aur phat gaya");
      }

      sendBtn.disabled = false;
    });
  </script>

</body>
</html>
